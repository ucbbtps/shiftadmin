<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shift Admin</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#14282a;--mu:#5d6f70;--bd:#d9e2e0;--ac:#0f766e;--P:#d5f0df;--A:#f8d9d9;--L:#dbe6f8;--WO:#e5e8e8}
@media(prefers-color-scheme:dark){:root{--bg:#101716;--card:#182322;--tx:#e6efed;--mu:#93a6a4;--bd:#2c3b39;--ac:#4fc3b4;--P:#1c3b2a;--A:#46252a;--L:#202f4c;--WO:#2a3331}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px calc(32px + env(safe-area-inset-bottom));max-width:980px;margin:auto}
h1,h2{margin:4px 0 8px}h1{font-size:20px}h2{font-size:17px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}.err{color:#b3261e}
input,select,button{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:9px 11px;min-width:0}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.big{display:block;width:100%;padding:20px;font-size:19px;font-weight:700;margin-top:10px;border-radius:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.bar>*{flex:1 1 130px}
.tabs{display:flex;gap:6px;margin:8px 0 12px;overflow-x:auto}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:center;font-size:12px;padding:0}
th{padding:4px 0;color:var(--mu)}.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:6px 10px;min-width:130px;white-space:nowrap;z-index:1}
td.c{height:38px;min-width:34px;font-weight:600;cursor:pointer;user-select:none}
.sP{background:var(--P)}.sA{background:var(--A)}.sL{background:var(--L)}.sWO{background:var(--WO)}
.row{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;display:none}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
// Paste your own values from Supabase > Project Settings > API
const API_URL='https://kieybwjygrruwnkzkzcr.supabase.co', API_KEY='sb_publishable_9mVZw4NnDnMABISqq7M0qw_W-ov15WY';
const CODES=['','P','A','CL','CH','EL','CML','HPL','RH','UJP','WO'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const n=new Date();let ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
let me=JSON.parse(sessionStorage.getItem('sa')||'null'),tab='mine',D=null,tt;
const out=h=>{$('#app').innerHTML=head()+h};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
async function rpc(fn,a){try{const r=await fetch(`${API_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+API_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});const j=await r.json();return r.ok?j:{error:j.message||'Request failed'}}catch(e){return{error:'Network error. Check your connection.'}}}
const cr=()=>({p_code:me.code,p_pin:me.pin});

function head(){if(!me)return '<h1>Shift Admin</h1>';
 const T=me.admin?[['reg','Register'],['emps','Employees'],['off','Office'],['mine','My check-in']]:[];
 return `<div class="bar"><h1 style="flex:2">Shift Admin</h1><button id="lo">Log out</button></div>${T.length?'<div class="tabs">'+T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')+'</div>':''}`}
document.addEventListener('click',e=>{if(e.target.id==='lo'){sessionStorage.removeItem('sa');me=null;render()}const t=e.target.dataset.t;if(t){tab=t;render()}});

function loginView(){out(`<div class="card"><h2>Log in</h2><div class="bar"><input id="c" placeholder="Employee code" autocomplete="username" autocapitalize="characters"><input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"></div><button class="pri big" id="go" style="margin-top:0">Log in</button><p class="err" id="e"></p></div>`);
 const go=async()=>{const code=$('#c').value.trim(),pin=$('#p').value;if(!code||!pin){$('#e').textContent='Enter your employee code and PIN.';return}
  const r=await rpc('login',{p_code:code,p_pin:pin});if(r.error){$('#e').textContent=r.error;return}
  me={code:r.code,pin,name:r.name,admin:r.admin};sessionStorage.setItem('sa',JSON.stringify(me));tab=me.admin?'reg':'mine';render()};
 $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}

const pos=()=>new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
async function mine(){const r=await rpc('my_month',{...cr(),p_month:ym});if(r.error)return out(`<p class="err">${esc(r.error)}</p>`);
 const t=r.rows.find(x=>x.day===r.today)||{};
 out(`<div class="card"><h2>${esc(me.name)}</h2><p class="mu">Today ${r.today}: ${esc(t.status||'not marked')}${t.check_in?', in '+hm(t.check_in):''}${t.check_out?', out '+hm(t.check_out):''}</p><button class="big pri" id="ci">Check in</button><button class="big" id="co">Check out</button><p class="mu" id="gm"></p></div>
 <div class="card"><b>This month</b>${r.rows.map(x=>`<div class="row"><span>${x.day.slice(8)}/${x.day.slice(5,7)}</span><span>${esc(x.status)}</span><span class="mu">${x.check_in?hm(x.check_in):''}${x.check_out?' to '+hm(x.check_out):''}</span></div>`).join('')||'<p class="mu">No records yet.</p>'}</div>`);
 const go=async k=>{const g=$('#gm');g.textContent='Getting your location...';let p;try{p=await pos()}catch(e){g.textContent='Could not get your location. Allow location access for this site and try again.';return}
  const x=await rpc('check_in_out',{...cr(),p_kind:k,p_lat:p.coords.latitude,p_lon:p.coords.longitude,p_acc:p.coords.accuracy});
  if(x.error){g.textContent=x.error;return}g.textContent=(k==='in'?'Checked in':'Checked out')+'. You are '+Math.round(x.dist)+' m from the office.';setTimeout(mine,1500)};
 $('#ci').onclick=()=>go('in');$('#co').onclick=()=>go('out')}

async function load(){D=await rpc('admin_data',{...cr(),p_month:ym});if(D.error){out(`<p class="err">${esc(D.error)}</p>`);return false}return true}
async function reg(){if(await load())draw()}
function draw(){const[y,m]=ym.split('-').map(Number),days=new Date(y,m,0).getDate(),A={};D.att.forEach(a=>A[a.emp+'|'+a.day]=a);
 let h=`<div class="bar"><input type="month" id="ym" value="${ym}"></div><p class="mu">Tap a cell to cycle: blank, P, A, CL, CH, EL, CML, HPL, RH, UJP, WO. A check-in marks P automatically.</p><div class="wrap"><table id="g"><tr><th class="nm">Employee</th>`;
 for(let d=1;d<=days;d++)h+=`<th>${d}</th>`;h+='</tr>';
 D.emps.filter(e=>e.active).forEach(e=>{h+=`<tr><td class="nm">${esc(e.name)}<div class="mu">${esc([e.code,e.designation,e.grp].filter(Boolean).join(', '))}</div></td>`;
  for(let d=1;d<=days;d++){const k=e.id+'|'+ym+'-'+String(d).padStart(2,'0'),a=A[k],s=a?a.status:'',c=s==='P'?'sP':s==='A'?'sA':s==='WO'?'sWO':s?'sL':'';
   h+=`<td class="c ${c}" data-k="${k}" title="${a&&a.check_in?'In '+hm(a.check_in)+(a.dist!=null?' ('+a.dist+' m)':''):''}">${s}</td>`}h+='</tr>'});
 const td=D.att.filter(a=>a.day===D.today&&a.check_in);
 h+=`</table></div><div class="card" style="margin-top:12px"><b>Today's check-ins (${td.length})</b>${td.map(a=>{const e=D.emps.find(x=>x.id===a.emp);return `<div class="row"><span>${esc(e?e.name:'')}</span><span class="mu">in ${hm(a.check_in)}${a.check_out?', out '+hm(a.check_out):''}, ${a.dist} m</span></div>`}).join('')||'<p class="mu">Nobody yet.</p>'}</div>`;
 out(h);
 $('#ym').onchange=e=>{if(e.target.value){ym=e.target.value;reg()}};
 $('#g').onclick=async e=>{const c=e.target.closest('td.c');if(!c)return;const k=c.dataset.k,p=k.split('|'),cur=(A[k]||{}).status||'',nx=CODES[(CODES.indexOf(cur)+1)%CODES.length];
  const r=await rpc('admin_set',{...cr(),p_emp:p[0],p_day:p[1],p_status:nx});if(r.error)return toast(r.error);
  if(!nx)D.att=D.att.filter(a=>!(a.emp===p[0]&&a.day===p[1]));else if(A[k])A[k].status=nx;else D.att.push({emp:p[0],day:p[1],status:nx});draw()}}

async function emps(sel){if(!D&&!await load())return;if(!sel&&!await load())return;const e=D.emps.find(x=>x.id===sel)||{};
 out(`<div class="card"><h2>${e.id?'Edit employee':'Add employee'}</h2><div class="bar"><input id="f1" placeholder="Employee code" value="${esc(e.code)}"><input id="f2" placeholder="Name" value="${esc(e.name)}"></div><div class="bar"><input id="f3" placeholder="Designation" value="${esc(e.designation)}"><input id="f4" placeholder="Group or shift" value="${esc(e.grp)}"></div><div class="bar"><label class="mu">Joining date <input type="date" id="f5" value="${e.doj||''}"></label><input id="f6" inputmode="numeric" placeholder="${e.id?'New PIN (leave blank to keep)':'PIN'}"></div><div class="bar"><label><input type="checkbox" id="f7" ${e.is_admin?'checked':''}> Admin</label><label><input type="checkbox" id="f8" ${e.id&&!e.active?'':'checked'}> Active</label></div><div class="bar"><button class="pri" id="sv">Save employee</button>${e.id?'<button id="nw">Add a new one</button>':''}</div></div>
 <div class="card"><b>Employees</b>${D.emps.map(x=>`<div class="row" data-e="${x.id}" style="cursor:pointer"><span>${esc(x.name)}<div class="mu">${esc([x.code,x.designation,x.grp].filter(Boolean).join(', '))}</div></span><span class="mu">${x.active?'':'Inactive'}${x.is_admin?' Admin':''}</span></div>`).join('')}</div>`);
 $('#sv').onclick=async()=>{const r=await rpc('admin_emp',{...cr(),p_id:e.id||null,p_ecode:$('#f1').value,p_name:$('#f2').value,p_desig:$('#f3').value,p_grp:$('#f4').value,p_doj:$('#f5').value||null,p_new_pin:$('#f6').value,p_is_admin:$('#f7').checked,p_active:$('#f8').checked});
  if(r.error)return toast(r.error);toast('Saved');D=null;emps()};
 if(e.id)$('#nw').onclick=()=>emps();
 $('#app').onclick=ev=>{const r=ev.target.closest('[data-e]');if(r)emps(r.dataset.e)}}

async function off(){if(!await load())return;const o=D.office;
 out(`<div class="card"><h2>Office location</h2><p class="mu">Stand at the office and tap the button, or type the coordinates. Employees can check in only within the radius.</p><button id="here" class="big pri" style="margin-top:0">Use my current location</button><div class="bar" style="margin-top:10px"><input id="la" placeholder="Latitude" value="${o.lat??''}"><input id="lo2" placeholder="Longitude" value="${o.lon??''}"><input id="ra" type="number" placeholder="Radius in metres" value="${o.radius??200}"></div><button class="pri" id="so">Save office location</button></div>`);
 $('#here').onclick=async()=>{try{const p=await pos();$('#la').value=p.coords.latitude.toFixed(6);$('#lo2').value=p.coords.longitude.toFixed(6)}catch(e){toast('Could not get your location. Allow location access and try again.')}};
 $('#so').onclick=async()=>{const la=parseFloat($('#la').value),lo=parseFloat($('#lo2').value),ra=parseInt($('#ra').value,10);if(isNaN(la)||isNaN(lo)||isNaN(ra))return toast('Enter latitude, longitude and radius.');
  const r=await rpc('admin_office',{...cr(),p_lat:la,p_lon:lo,p_radius:ra});toast(r.error||'Saved')}}

function render(){$('#app').onclick=null;if(!me)return loginView();if(!me.admin)tab='mine';({reg,emps,off,mine})[tab]()}
render();
</script></body></html>
