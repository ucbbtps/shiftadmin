<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shift Admin</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#14282a;--mu:#5d6f70;--bd:#d9e2e0;--ac:#0f766e;--P:#d5f0df;--A:#f8d9d9;--L:#dbe6f8;--WO:#e5e8e8}
@media(prefers-color-scheme:dark){:root{--bg:#101716;--card:#182322;--tx:#e6efed;--mu:#93a6a4;--bd:#2c3b39;--ac:#4fc3b4;--P:#1c3b2a;--A:#46252a;--L:#202f4c;--WO:#2a3331}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px calc(32px + env(safe-area-inset-bottom));max-width:980px;margin:auto}
h1,h2{margin:4px 0 8px}h1{font-size:20px}h2{font-size:17px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}.err{color:#b3261e}
input,select,button{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:9px 11px;min-width:0}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.big{display:block;width:100%;padding:20px;font-size:19px;font-weight:700;margin-top:10px;border-radius:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.bar>*{flex:1 1 130px}
.tabs{display:flex;gap:6px;margin:8px 0 12px;overflow-x:auto}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:center;font-size:12px;padding:0}
th{padding:4px 0;color:var(--mu)}.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:6px 10px;min-width:130px;white-space:nowrap;z-index:1}
td.c{height:38px;min-width:34px;font-weight:600;cursor:pointer;user-select:none}
.sP{background:var(--P)}.sA{background:var(--A)}.sL{background:var(--L)}.sWO{background:var(--WO)}:root{--hD:#b9f1f3;--hE:#e1c9f2;--hCS:#b5f5c0;--hN:#efd9b0;--hO:#e9ecec}@media(prefers-color-scheme:dark){:root{--hD:#17505a;--hE:#3d2a56;--hCS:#1c5030;--hN:#5a4423;--hO:#3a4140}}.hD{background:var(--hD)}.hE{background:var(--hE)}.hCS{background:var(--hCS)}.hN{background:var(--hN)}.hO{background:var(--hO)}.i{color:var(--mu);opacity:.55;font-weight:400}.x{outline:2px solid var(--ac);outline-offset:-2px;font-size:11px;white-space:nowrap}.o{text-decoration:underline}
.row{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;z-index:30}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script src="config.js"></script>
<script>
// Paste your own values from Supabase > Project Settings > API
const API_URL=(window.CONFIG||{}).url||'https://YOUR-PROJECT.supabase.co', API_KEY=(window.CONFIG||{}).key||'YOUR-ANON-PUBLIC-KEY';
const CODES=['','P','A','CL','CH','EL','CML','HPL','RH','UJP','WO'];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const n=new Date();let ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
let me=JSON.parse(sessionStorage.getItem('sa')||'null'),tab='mine',D=null,tt;
const out=h=>{$('#app').innerHTML=head()+h};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
async function rpc(fn,a){if(API_URL.includes('YOUR-PROJECT')||API_KEY.includes('YOUR-ANON'))return{error:'Set API_URL and API_KEY at the top of index.html, then upload it again.'};try{const r=await fetch(`${API_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:API_KEY,Authorization:'Bearer '+API_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});const j=await r.json();return r.ok?j:{error:j.message||'Request failed'}}catch(e){return{error:'Could not reach '+API_URL+'. Check that API_URL is correct and the project is not paused.'}}}
const cr=()=>({p_code:me.code,p_pin:me.pin});

function head(){if(!me)return '<h1>Shift Admin</h1>';
 const T=me.admin?[['reg','Register'],['ch','CH register'],['bal','Balances'],['sm','Summary'],['emps','Employees'],['off','Office']].concat(window.Native?[]:[['mine','My check-in']]):[];
 return `${window.Native?'':'<div class="bar"><h1 style="flex:2">Shift Admin</h1><button id="lo">Log out</button></div>'}${T.length?'<div class="tabs">'+T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')+'</div>':''}`}
document.addEventListener('click',e=>{if(e.target.id==='lo'){sessionStorage.removeItem('sa');me=null;render()}const t=e.target.dataset.t;if(t){tab=t;render()}});

function loginView(){out(`<div class="card"><h2>Log in</h2><div class="bar"><input id="c" placeholder="Employee code" autocomplete="username" autocapitalize="characters"><input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"></div><button class="pri big" id="go" style="margin-top:0">Log in</button><p class="err" id="e"></p></div>`);
 const go=async()=>{const code=$('#c').value.trim(),pin=$('#p').value;if(!code||!pin){$('#e').textContent='Enter your employee code and PIN.';return}
  const r=await rpc('login',{p_code:code,p_pin:pin});if(r.error){$('#e').textContent=r.error;return}
  me={code:r.code,pin,name:r.name,admin:r.admin};sessionStorage.setItem('sa',JSON.stringify(me));tab=me.admin?'reg':'mine';render()};
 $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()}}

const pos=()=>new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));
async function mine(){const r=await rpc('my_month',{...cr(),p_month:ym});if(r.error)return out(`<p class="err">${esc(r.error)}</p>`);
 const t=r.rows.find(x=>x.day===r.today)||{};const b=await rpc('my_balance',{...cr(),p_year:+r.today.slice(0,4)});
 out(`<div class="card"><h2>${esc(me.name)}</h2><p class="mu">Today ${r.today}, shift ${SHN[r.ovt||shiftOf(r.offset,r.today)]}: ${esc(t.status||'not marked')}${t.check_in?', in '+hm(t.check_in):''}${t.check_out?', out '+hm(t.check_out):''}</p><button class="big pri" id="ci">Check in</button><button class="big" id="co">Check out</button><p class="mu" id="gm"></p><label class="mu"><input type="checkbox" id="au" ${localStorage.getItem('auto')==='off'?'':'checked'}> Check in automatically when I arrive. Keep this page open.</label></div>
 ${balCard(b,r.today.slice(0,4))}<div class="card"><b>This month</b>${r.rows.map(x=>`<div class="row"><span>${x.day.slice(8)}/${x.day.slice(5,7)}</span><span>${esc(x.status)}</span><span class="mu">${x.check_in?hm(x.check_in):''}${x.check_out?' to '+hm(x.check_out):''}</span></div>`).join('')||'<p class="mu">No records yet.</p>'}</div>`);
 const go=async k=>{const g=$('#gm');g.textContent='Getting your location...';let p;try{p=await pos()}catch(e){g.textContent='Could not get your location. Allow location access for this site and try again.';return}
  const x=await rpc('check_in_out',{...cr(),p_kind:k,p_lat:p.coords.latitude,p_lon:p.coords.longitude,p_acc:p.coords.accuracy});
  if(x.error){g.textContent=x.error;return}g.textContent=(k==='in'?'Checked in':'Checked out')+'. You are '+Math.round(x.dist)+' m from the office.';setTimeout(mine,1500);return true};
 $('#ci').onclick=()=>go('in');$('#co').onclick=()=>go('out');$('#au').onchange=e=>{localStorage.setItem('auto',e.target.checked?'on':'off');mine()};if(!t.check_in&&$('#au').checked)watch(r.office,go)}

async function load(){D=await rpc('admin_data',{...cr(),p_month:ym});if(D.error){out(`<p class="err">${esc(D.error)}</p>`);return false}return true}
let X=[],OV={},rm='',rp=(()=>{const t=new Date(),m=t.getDate()>15?new Date(t.getFullYear(),t.getMonth()+1,1):t;return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')})();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const f2=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const p=s.split('-').map(Number);return f2(new Date(p[0],p[1]-1,p[2]+n))};
const plan=(e,d)=>OV[e.id+'|'+d]||shiftOf(e.offset,d);
function period(){const[y,m]=rp.split('-').map(Number);return[f2(new Date(y,m-2,16)),f2(new Date(y,m-1,15))]}
async function reg(){if(!await load())return;const[a,b]=period(),r=await rpc('admin_range',{...cr(),p_from:a,p_to:addD(b,1)});if(r.error)return toast(r.error);D.att=r.att;X=r.extra;OV={};r.ov.forEach(o=>OV[o.emp+'|'+o.day]=o.shift);draw()}
function draw(){const w0=$('.wrap'),sl=w0?w0.scrollLeft:0,sy=window.scrollY,same=rm===rp;rm=rp;
 const[a,b]=period(),days=[];for(let d=a;d<=b;d=addD(d,1))days.push(d);
 const A={},XM={};D.att.forEach(x=>A[x.emp+'|'+x.day]=x);X.forEach(x=>XM[x.emp+'|'+x.day]=x);
 const wk=(e,d)=>{const x=A[e.id+'|'+d],z=XM[e.id+'|'+d];return x&&x.status==='P'?[plan(e,d)].concat(z?[z.shift]:[]):[]};
 const sa=e=>days.reduce((n,d)=>{const w=wk(e,d);return n+(w.includes('N')?1:0)+(w.includes('E')&&!wk(e,addD(d,1)).includes('N')?1:0)},0);
 let h=`<div class="bar"><label class="mu">Period ending 15th of <input type="month" id="rp" value="${rp}"></label></div><p class="mu">Showing ${a} to ${b}. Tap a cell to choose a status or change the planned shift. A check-in marks P automatically. Grey letters are the planned shift and turn colored when the employee is present. An outlined cell such as D+N is a planned shift plus an extra shift. An underlined letter is a changed shift. SA is the shift allowance count: Evng and Night shifts worked while present, and an Evng followed by a Night on the next day counts once.</p><div class="bar mu" style="gap:6px">${['D','E','CS','N','O'].map(x=>`<span class="h${x}" style="padding:2px 8px;border-radius:6px;flex:0 0 auto">${SHN[x]}</span>`).join('')}</div><div class="wrap"><table id="g"><tr><th class="nm">Employee</th>`;
 days.forEach(d=>{h+=`<th title="${d}">${+d.slice(8)}${d===a||d.slice(8)==='01'?'<br>'+MON[+d.slice(5,7)-1]:''}</th>`});h+='</tr>';
 D.emps.filter(e=>e.active).forEach(e=>{h+=`<tr><td class="nm">${esc(e.name)}<div class="mu">${esc([e.code,e.designation,e.grp].filter(Boolean).join(', '))}</div><div class="mu"><b>SA ${sa(e)}</b></div></td>`;
  days.forEach(d=>{const k=e.id+'|'+d,x=A[k],xe=XM[k],st=x?x.status:'',sh=plan(e,d),c=(st==='P'?'h'+sh:st==='A'?'sA':st==='WO'?'sWO':st?'sL':'i')+(xe?' x':'')+(OV[k]?' o':''),tx=xe?SHL[sh]+'+'+(SHL[xe.shift]||'X'):st&&st!=='P'?st:SHL[sh];
   h+=`<td class="c ${c}" data-k="${k}" title="${x&&x.check_in?'In '+hm(x.check_in)+(x.dist!=null?' ('+x.dist+' m)':''):''}">${tx}</td>`});h+='</tr>'});
 const td=D.att.filter(x=>x.day===D.today&&x.check_in);
 h+=`</table></div><div class="card" style="margin-top:12px"><b>Today's check-ins (${td.length})</b>${td.map(x=>{const e=D.emps.find(z=>z.id===x.emp);return `<div class="row"><span>${esc(e?e.name:'')}</span><span class="mu">in ${hm(x.check_in)}${x.check_out?', out '+hm(x.check_out):''}, ${x.dist} m</span></div>`}).join('')||'<p class="mu">Nobody yet.</p>'}</div>`;
 out(h);if(same){const w1=$('.wrap');if(w1)w1.scrollLeft=sl;window.scrollTo(0,sy)}
 $('#rp').onchange=e=>{if(e.target.value){rp=e.target.value;reg()}};
 $('#g').onclick=e=>{const c=e.target.closest('td.c');if(c)pick(c.dataset.k)}}
async function emps(sel){if(!D&&!await load())return;if(!sel&&!await load())return;const e=D.emps.find(x=>x.id===sel)||{};
 out(`<div class="card"><h2>${e.id?'Edit employee':'Add employee'}</h2><div class="bar"><input id="f1" placeholder="Employee code" value="${esc(e.code)}"><input id="f2" placeholder="Name" value="${esc(e.name)}"></div><div class="bar"><input id="f3" placeholder="Designation" value="${esc(e.designation)}"><input id="f4" placeholder="Group or shift" value="${esc(e.grp)}"></div><div class="bar"><label class="mu">Joining date <input type="date" id="f5" value="${e.doj||''}"></label><input id="f6" inputmode="numeric" placeholder="${e.id?'New PIN (leave blank to keep)':'PIN'}"></div><div class="bar"><label class="mu">Shift cycle offset, 0 to 7 (0 follows the shift calendar) <input type="number" id="f9" min="0" max="7" value="${e.offset||0}"></label></div><div class="bar"><label><input type="checkbox" id="f7" ${e.is_admin?'checked':''}> Admin</label><label><input type="checkbox" id="f8" ${e.id&&!e.active?'':'checked'}> Active</label></div><div class="bar"><button class="pri" id="sv">Save employee</button>${e.id?'<button id="nw">Add a new one</button>':''}</div></div>
 <div class="card"><b>Employees</b>${D.emps.map(x=>`<div class="row" data-e="${x.id}" style="cursor:pointer"><span>${esc(x.name)}<div class="mu">${esc([x.code,x.designation,x.grp].filter(Boolean).join(', '))}</div></span><span class="mu">${x.active?'':'Inactive'}${x.is_admin?' Admin':''}</span></div>`).join('')}</div>`);
 $('#sv').onclick=async()=>{const r=await rpc('admin_emp',{...cr(),p_id:e.id||null,p_ecode:$('#f1').value,p_name:$('#f2').value,p_desig:$('#f3').value,p_grp:$('#f4').value,p_doj:$('#f5').value||null,p_new_pin:$('#f6').value,p_is_admin:$('#f7').checked,p_active:$('#f8').checked,p_offset:parseInt($('#f9').value,10)||0});
  if(r.error)return toast(r.error);toast('Saved');D=null;emps()};
 if(e.id)$('#nw').onclick=()=>emps();
 $('#app').onclick=ev=>{const r=ev.target.closest('[data-e]');if(r)emps(r.dataset.e)}}

async function off(){if(!await load())return;const o=D.office;
 out(`<div class="card"><h2>Office location</h2><p class="mu">Stand at the office and tap the button, or type the coordinates. Employees can check in only within the radius.</p><button id="here" class="big pri" style="margin-top:0">Use my current location</button><div class="bar" style="margin-top:10px"><input id="la" placeholder="Latitude" value="${o.lat??''}"><input id="lo2" placeholder="Longitude" value="${o.lon??''}"><input id="ra" type="number" placeholder="Radius in metres" value="${o.radius??200}"></div><button class="pri" id="so">Save office location</button></div>`);
 $('#here').onclick=async()=>{try{const p=await pos();$('#la').value=p.coords.latitude.toFixed(6);$('#lo2').value=p.coords.longitude.toFixed(6)}catch(e){toast('Could not get your location. Allow location access and try again.')}};
 $('#so').onclick=async()=>{const la=parseFloat($('#la').value),lo=parseFloat($('#lo2').value),ra=parseInt($('#ra').value,10);if(isNaN(la)||isNaN(lo)||isNaN(ra))return toast('Enter latitude, longitude and radius.');
  const r=await rpc('admin_office',{...cr(),p_lat:la,p_lon:lo,p_radius:ra});toast(r.error||'Saved')}}

let armed='';
// Shift cycle from the shift calendar: Day, Day, Evng, Evng, CS, Night, Night, Off. 1 Oct 2026 is the first Day.
const SH=['D','D','E','E','CS','N','N','O'],SHL={D:'D',E:'E',CS:'CS',N:'N',O:'Off'},SHN={D:'Day',E:'Evng',CS:'CS',N:'Night',O:'Off'};
const shiftOf=(off,day)=>{const p=day.split('-').map(Number),k=Math.round((Date.UTC(p[0],p[1]-1,p[2])-Date.UTC(2026,9,1))/864e5);return SH[(((k+(off||0))%8)+8)%8]};
function addM(s,m){const p=s.split('-').map(Number);let t=new Date(p[0],p[1]-1+m,p[2]);if(t.getDate()!==p[2])t=new Date(p[0],p[1]+m,0);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
let wid=null,busy=false;
const hav=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
function stopWatch(){if(wid!==null&&navigator.geolocation)navigator.geolocation.clearWatch(wid);wid=null}
function watch(o,go){const g=$('#gm');if(!o||o.lat==null){g.textContent='Office location is not set yet.';return}if(!navigator.geolocation)return;
 g.textContent='Watching for your arrival...';
 wid=navigator.geolocation.watchPosition(async p=>{if(busy)return;const d=hav(p.coords.latitude,p.coords.longitude,o.lat,o.lon);
  if(d>o.radius){g.textContent='Waiting for you to reach the office ('+Math.round(d)+' m away).';return}
  if(p.coords.accuracy>200){g.textContent='You are in range. Waiting for a more accurate location.';return}
  busy=true;stopWatch();const ok=await go('in');busy=false;if(!ok)g.textContent+=' Tap Check in to try again.'},
  ()=>{g.textContent='Location is blocked. Allow location access to check in automatically.'},{enableHighAccuracy:true,maximumAge:5000})}

const opts=()=>D.emps.filter(e=>e.active).map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.code)})</option>`).join('');
function pick(k){const p=k.split('|'),e=D.emps.find(z=>z.id===p[0]),a=D.att.find(z=>z.emp===p[0]&&z.day===p[1]),x=X.find(z=>z.emp===p[0]&&z.day===p[1]),cur=x?'XD':(a?a.status:''),cp=OV[k]||'',O=[['','Clear'],['P','Present'],['A','Absent'],['CL','CL'],['CH','CH'],['EL','EL'],['CML','CML'],['HPL','HPL'],['RH','RH'],['UJP','UJP'],['WO','Weekly Off'],['XD','Extra duty']],PL=[['','Regular rotation'],['D','Day'],['E','Evng'],['CS','CS'],['N','Night'],['O','Off']];
 const m=document.createElement('div');m.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;overflow:auto';
 m.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0 0 env(safe-area-inset-bottom)"><b>${esc(e.name)}</b><div class="mu">${p[1]}, planned shift ${SHN[plan(e,p[1])]}</div><div class="mu" style="margin-top:10px">Status</div><div class="bar"><select id="ps">${O.map(o=>`<option value="${o[0]}" ${o[0]===cur?'selected':''}>${o[1]}</option>`).join('')}</select><select id="px">${['D','E','CS','N'].map(c=>`<option value="${c}" ${x&&x.shift===c?'selected':''}>${SHN[c]} shift</option>`).join('')}</select></div><p class="mu" id="pn"></p><div class="mu">Planned shift</div><div class="bar"><select id="pl">${PL.map(o=>`<option value="${o[0]}" ${o[0]===cp?'selected':''}>${o[1]}</option>`).join('')}</select><label class="mu" id="ptw">Apply until <input type="date" id="pt" value="${p[1]}" min="${p[1]}"></label></div><div class="bar"><button class="pri" id="psv">Save</button><button id="pcx">Cancel</button></div></div>`;
 document.body.appendChild(m);
 const sy=()=>{const v=$('#ps').value==='XD';$('#px').style.display=v?'':'none';$('#pn').textContent=v?'Choose the extra shift worked. 1 CH is credited automatically.':'';$('#ptw').style.display=$('#pl').value!==cp?'':'none'};
 $('#ps').onchange=sy;$('#pl').onchange=sy;sy();$('#pcx').onclick=()=>m.remove();m.onclick=ev=>{if(ev.target===m)m.remove()};
 $('#psv').onclick=async()=>{const v=$('#ps').value,xs=$('#px').value,pl=$('#pl').value;
  if(pl!==cp){const r=await rpc('admin_shift',{...cr(),p_emp:p[0],p_from:p[1],p_to:$('#pt').value||p[1],p_shift:pl});if(r.error)return toast(r.error)}
  if(v!==cur||(v==='XD'&&x&&x.shift!==xs)){const r=await rpc('admin_cell',{...cr(),p_emp:p[0],p_day:p[1],p_status:v,p_xshift:v==='XD'?xs:null});if(r.error){toast(r.error);if(pl!==cp)reg();return}
   if(v==='XD'&&!r.changed)toast(r.credited?'Extra duty saved. 1 CH credited.':'Extra duty saved. No CH credited because the limit of 15 a year is reached.')}
  m.remove();reg()}}

async function chv(){if(!await load())return;
 out(`<div class="card"><h2>Credit CH</h2><div class="bar"><select id="ce">${opts()}</select><input id="co" placeholder="Occasion"><label class="mu">Date of occasion <input type="date" id="cod"></label><label class="mu">Date of credit <input type="date" id="cdd" value="${D.today}"></label></div><button class="pri" id="ca">Credit CH</button><p class="mu">Maximum 15 CH per employee per year, counted by date of credit. Each CH expires 3 months after its date of credit. When CH is marked in the Register, the oldest available CH is used first.</p></div>
 <div class="wrap"><table><tr><th class="nm">Employee</th><th>Occasion</th><th>Occasion date</th><th>Credited</th><th>Expires</th><th>Status</th><th></th></tr>${D.ch.map(c=>{const e=D.emps.find(z=>z.id===c.emp)||{},ex=addM(c.cdate,3),st=c.avail?'Availed '+c.avail:ex<D.today?'Expired':'Available';return `<tr><td class="nm">${esc(e.name)}</td><td style="padding:6px">${esc(c.occasion)}</td><td>${c.odate||''}</td><td>${c.cdate}</td><td>${ex}</td><td style="padding:6px">${st}</td><td style="padding:4px">${c.avail?'':`<button data-cd="${c.id}">${armed===c.id?'Confirm':'Delete'}</button>`}</td></tr>`}).join('')}</table></div>`);
 $('#ca').onclick=async()=>{const r=await rpc('admin_ch_add',{...cr(),p_emp:$('#ce').value,p_occasion:$('#co').value,p_odate:$('#cod').value||null,p_cdate:$('#cdd').value||null});if(r.error)return toast(r.error);toast('CH credited');chv()};
 $('#app').onclick=async e=>{const id=e.target.dataset.cd;if(!id)return;if(armed!==id){armed=id;chv();return}armed='';const r=await rpc('admin_ch_del',{...cr(),p_id:id});if(r.error)toast(r.error);chv()}}

const LV=['CL','RH','EL','CML','HPL','CH','UJP'];
function balTable(b){return `<table><tr><th class="nm" style="position:static">Leave</th><th>Credited</th><th>Used</th><th>Balance</th></tr>${LV.map(k=>{const x=b[k];return `<tr><td class="nm" style="position:static">${k}</td><td style="padding:8px 6px">${x[0]??'-'}</td><td>${x[1]}</td><td style="font-weight:700;${typeof x[2]==='number'&&x[2]<0?'color:#b3261e':''}">${x[2]??'No limit'}</td></tr>`}).join('')}</table>`}
const balCard=(b,y)=>b&&!b.error?`<div class="card"><b>Leave balance ${y}</b><div class="wrap" style="margin-top:6px">${balTable(b)}</div><p class="mu">Next CH expiry: ${b.nx||'none'}. CL and RH reset each 1 Jan. EL and CML carry forward. Each HPL day uses half a CML.</p></div>`:'';
let by=new Date().getFullYear(),sp='month';
async function bal(){if(!await load())return;const r=await rpc('admin_bal',{...cr(),p_year:by});if(r.error)return out(`<p class="err">${esc(r.error)}</p>`);
 out(`<div class="bar"><label class="mu">Year <input type="number" id="by" value="${by}"></label></div><p class="mu">CL 15 and RH 2 are credited each 1 Jan and reset yearly. EL 30 is credited each 1 Jan and carries forward. CML 10 is credited on the 1st of each employee's joining month every year and carries forward. 1 CML = 2 HPL. Set each joining date in Employees.</p>${r.map(x=>{const e=D.emps.find(z=>z.id===x.id)||{},ad=x.bal.adj||{};return `<div class="card"><b>${esc(e.name)}</b> <span class="mu">${esc(e.code)}${e.doj?', joined '+e.doj:', no joining date'}</span><div class="wrap" style="margin-top:6px">${balTable(x.bal)}</div><div class="mu" style="margin-top:8px">Opening adjustment (+/-), added to the balance. CL, RH, CH and UJP apply to ${by} only. A UJP adjustment is added to days used. An HPL adjustment changes CML by half that amount.</div><div class="bar">${LV.map(k=>{const key=['CL','RH','CH','UJP'].includes(k)?k+'@'+by:k;return `<label class="mu">${k} <input type="number" step="0.5" data-ak="${x.id}|${key}" value="${ad[key]||0}" style="width:70px"></label>`}).join('')}</div></div>`}).join('')}`);
 $('#by').onchange=e=>{const v=parseInt(e.target.value,10);if(v>2000){by=v;bal()}};
 $('#app').onchange=async e=>{const t=e.target;if(!t.dataset.ak)return;const p=t.dataset.ak.split('|'),v=parseFloat(t.value);if(isNaN(v))return;const q=await rpc('admin_adj',{...cr(),p_emp:p[0],p_key:p[1],p_val:v});if(q.error)toast(q.error);else bal()}}

async function sm(){if(!await load())return;const Y=+ym.slice(0,4),M=+ym.slice(5),f=sp==='month'?ym+'-01':Y+'-01-01',t=sp==='month'?ym+'-'+String(new Date(Y,M,0).getDate()).padStart(2,'0'):Y+'-12-31';
 const r=await rpc('admin_counts',{...cr(),p_from:f,p_to:t});if(r.error)return out(`<p class="err">${esc(r.error)}</p>`);
 const C={};r.forEach(x=>{(C[x.emp]=C[x.emp]||{})[x.st]=x.n});const K=['P','A','CL','CH','EL','CML','HPL','RH','UJP'],LK=K.slice(2);
 out(`<div class="bar"><input type="month" id="ym" value="${ym}"><select id="sp"><option value="month" ${sp==='month'?'selected':''}>Month</option><option value="year" ${sp==='year'?'selected':''}>Full year</option></select></div><div class="wrap"><table><tr><th class="nm">Employee</th>${K.map(k=>`<th>${k}</th>`).join('')}<th>Leave</th><th>Att %</th></tr>${D.emps.filter(e=>e.active).map(e=>{const c=C[e.id]||{},lv=LK.reduce((a,k)=>a+(c[k]||0),0),den=(c.P||0)+(c.A||0)+lv;return `<tr><td class="nm">${esc(e.name)}</td>${K.map(k=>`<td style="padding:8px 6px">${c[k]||'.'}</td>`).join('')}<td><b>${lv}</b></td><td>${den?Math.round((c.P||0)/den*100)+'%':'-'}</td></tr>`}).join('')}</table></div><p class="mu">Att % = Present / (Present + Absent + all leave days). Weekly Off and unmarked days are not counted.</p>`);
 $('#ym').onchange=e=>{if(e.target.value){ym=e.target.value;sm()}};$('#sp').onchange=e=>{sp=e.target.value;sm()}}

function render(){stopWatch();$('#app').onclick=null;$('#app').onchange=null;rm='';if(!me)return loginView();if(!me.admin)tab='mine';else if(window.Native&&tab==='mine')tab='reg';({reg,ch:chv,bal,sm,emps,off,mine})[tab]()}
(async()=>{if(!me&&window.Native){try{const c=JSON.parse(Native.creds()),r=await rpc('login',{p_code:c.code,p_pin:c.pin});if(!r.error){me={code:r.code,pin:c.pin,name:r.name,admin:r.admin};sessionStorage.setItem('sa',JSON.stringify(me));tab=me.admin?'reg':'mine'}else if(/Invalid code/.test(r.error)){Native.logout();return}else{$('#app').innerHTML='<p class="err" style="padding:16px">'+esc(r.error)+'</p>';return}}catch(e){}}render()})();
</script></body></html>
